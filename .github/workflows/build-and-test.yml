name: Build and test

on:
  push:
    branches: [ "main", "dev", "v2"]
  pull_request:
    branches: [ "main", "dev", "v2"]
  workflow_dispatch:

jobs:
  build-and-test-default:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y build-essential libxml2 libxml2-dev zlib1g-dev python3-tk graphviz libjpeg-dev zlib1g-dev
        python -m pip install .[default]

    - name: Verify installed package outside checkout
      working-directory: /tmp
      run: python "$GITHUB_WORKSPACE/script/check_installed_package.py"

    - name: Parser tests (no dataset access)
      run: python -m pytest tests/test_parser*

    - name: Optional network integration tests
      if: github.event_name == 'workflow_dispatch'
      run: python -m pytest tests/test.py
      

  build-and-test-rcd:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.8"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y build-essential libxml2 libxml2-dev zlib1g-dev python3-tk graphviz libjpeg-dev zlib1g-dev
        python -m venv env-rcd
        . env-rcd/bin/activate
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install pytest
        python -m pip install .[rcd]

        bash script/link.sh

    - name: Verify installed package outside checkout
      working-directory: /tmp
      run: |
        . "$GITHUB_WORKSPACE/env-rcd/bin/activate"
        python "$GITHUB_WORKSPACE/script/check_installed_package.py"

    - name: Install PyRCA integration dependencies
      if: github.event_name == 'workflow_dispatch'
      run: |
        . "$GITHUB_WORKSPACE/env-rcd/bin/activate"
        sudo apt install -y openjdk-11-jre-headless
        git clone https://github.com/salesforce/PyRCA.git
        cd PyRCA
        python -m pip install "JPype1<1.5"
        python -m pip install -e .

    - name: Optional RCD network integration tests
      if: github.event_name == 'workflow_dispatch'
      run: |
        . env-rcd/bin/activate
        python -m pytest tests/test_rcd.py
